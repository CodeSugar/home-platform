apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: hubble-ui
  namespace: kube-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    acme.cert-manager.io/http01-parentreffallback: "true"
spec:
  parentRef:
    name: main-gateway
    namespace: gateway-system
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    hostname: hubble.codesugar.mx
    tls:
      mode: Terminate
      certificateRefs:
      - name: hubble-codesugar-mx-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: kube-system
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: ListenerSet
    name: hubble-ui
    sectionName: https
  hostnames:
  - hubble.codesugar.mx
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: hubble-ui
      port: 80
