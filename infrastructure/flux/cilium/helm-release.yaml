apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m0s
  releaseName: cilium
  targetNamespace: kube-system
  storageNamespace: kube-system
  chart:
    spec:
      chart: cilium
      version: "1.20.1"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
      interval: 1h0m0s
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: false
  values:
    kubeProxyReplacement: true
    # Default value
    l7Proxy: true
    l2announcements:
      enabled: true
    bpf:
      tproxy: true
    k8sClientRateLimit:
      qps: 10
      burst: 15
    externalIPs:
      enabled: true
    operator:
      replicas: 1
    gatewayAPI:
      enabled: true
