apiVersion: v1
kind: Namespace
metadata:
  name: test2
---
apiVersion: v1
kind: Pod
metadata:
  name: whoami
  namespace: test2
  labels:
    app: whoami
spec:
  containers:
  - name: whoami
    image: traefik/whoami:v1.10.3
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: test2
spec:
  selector:
    app: whoami
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: test2
spec:
  parentRefs:
  - name: main-gateway
    namespace: gateway-system
  hostnames:
  - test2.codesugar.mx
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: whoami
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: whoami-private
  namespace: test2
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    acme.cert-manager.io/http01-parentreffallback: "true"
spec:
  parentRef:
    name: main-gateway
    namespace: gateway-system
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    hostname: whoami-private.codesugar.mx
    tls:
      mode: Terminate
      certificateRefs:
      - name: whoami-private-codesugar-mx-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami-private-ls
  namespace: test2
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: ListenerSet
    name: whoami-private
    sectionName: https
  hostnames:
  - whoami-private.codesugar.mx
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: whoami
      port: 80
