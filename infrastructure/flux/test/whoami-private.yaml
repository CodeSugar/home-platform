apiVersion: v1
kind: Namespace
metadata:
  name: test2
---
apiVersion: v1
kind: Pod
metadata:
  name: whoami
  namespace: test2
  labels:
    app: whoami
spec:
  containers:
  - name: whoami
    image: traefik/whoami:v1.10.3
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: test2
spec:
  selector:
    app: whoami
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: whoami-private
  namespace: test2
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    acme.cert-manager.io/http01-parentreffallback: "true"
spec:
  parentRef:
    name: main-gateway
    namespace: gateway-system
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    hostname: whoami-private.codesugar.mx
    tls:
      mode: Terminate
      certificateRefs:
      - name: whoami-private-codesugar-mx-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami-private-ls
  namespace: test2
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: ListenerSet
    name: whoami-private
    sectionName: https
  hostnames:
  - whoami-private.codesugar.mx
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    # Hand off to Envoy Gateway, which enforces Authelia (see SecurityPolicy below)
    backendRefs:
    - name: envoy-internal
      namespace: envoy-gateway-system
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami-private
  namespace: test2
spec:
  parentRefs:
  - name: internal-gateway
    namespace: envoy-gateway-system
  hostnames:
  - whoami-private.codesugar.mx
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: whoami
      port: 80
---
# https://www.authelia.com/integration/kubernetes/envoy/gateway/
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: authelia-extauthz
  namespace: test2
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: whoami-private
  extAuth:
    headersToExtAuth:
    - accept
    - cookie
    - authorization
    - proxy-authorization
    - x-forwarded-proto
    failOpen: false
    http:
      backendRefs:
      - name: authelia
        namespace: auth
        port: 9091
      path: /api/authz/ext-authz/
      headersToBackend:
      - Remote-User
      - Remote-Groups
      - Remote-Name
      - Remote-Email
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: test2-securitypolicy-to-authelia
  namespace: auth
spec:
  from:
  - group: gateway.envoyproxy.io
    kind: SecurityPolicy
    namespace: test2
  to:
  - group: ""
    kind: Service
    name: authelia
