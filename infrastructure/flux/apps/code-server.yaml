apiVersion: v1
kind: Namespace
metadata:
  name: code-server
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: code-server
  namespace: code-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-read-only
rules:
# Core group: enumerated explicitly so that secrets are excluded
- apiGroups: [""]
  resources:
  - bindings
  - componentstatuses
  - configmaps
  - endpoints
  - events
  - limitranges
  - namespaces
  - namespaces/status
  - nodes
  - nodes/status
  - persistentvolumeclaims
  - persistentvolumeclaims/status
  - persistentvolumes
  - persistentvolumes/status
  - pods
  - pods/log
  - pods/status
  - podtemplates
  - replicationcontrollers
  - replicationcontrollers/scale
  - replicationcontrollers/status
  - resourcequotas
  - resourcequotas/status
  - serviceaccounts
  - services
  - services/status
  verbs: ["get", "list", "watch"]
# Non-core groups: secrets only live in the core group, so wildcards are safe here
- apiGroups:
  - admissionregistration.k8s.io
  - apiextensions.k8s.io
  - apiregistration.k8s.io
  - apps
  - autoscaling
  - batch
  - certificates.k8s.io
  - coordination.k8s.io
  - discovery.k8s.io
  - events.k8s.io
  - flowcontrol.apiserver.k8s.io
  - metrics.k8s.io
  - networking.k8s.io
  - node.k8s.io
  - policy
  - rbac.authorization.k8s.io
  - resource.k8s.io
  - scheduling.k8s.io
  - storage.k8s.io
  # CRDs
  - acme.cert-manager.io
  - cert-manager.io
  - cilium.io
  - fluxcd.controlplane.io
  - gateway.envoyproxy.io
  - gateway.networking.k8s.io
  - gateway.networking.x-k8s.io
  - helm.toolkit.fluxcd.io
  - image.toolkit.fluxcd.io
  - kustomize.toolkit.fluxcd.io
  - notification.toolkit.fluxcd.io
  - source.toolkit.fluxcd.io
  resources: ["*"]
  verbs: ["get", "list", "watch"]
- nonResourceURLs: ["*"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: code-server-cluster-read-only
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-read-only
subjects:
- kind: ServiceAccount
  name: code-server
  namespace: code-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-server
  namespace: code-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: code-server
  template:
    metadata:
      labels:
        app: code-server
    spec:
      serviceAccountName: code-server
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # Not hostNetwork: dockerd creates its own bridge and iptables rules, which
      # must stay inside the pod netns instead of clobbering Cilium's on the host.
      # Ports published with `docker run -p` are reachable on localhost from
      # code-server (shared pod netns), e.g. via code-server's /proxy/<port>/.
      initContainers:
      # The code-server image ships no docker CLI; copy it (plus the buildx/compose
      # plugins) from the matching CLI image into a volume code-server mounts
      - name: docker-cli
        image: docker:29.9.2-cli@sha256:5e6baf67325a79f64ed3bed6863954d5e05d0f3d4e57cbdb14809346814bbfdb
        command:
        - sh
        - -c
        - cp /usr/local/bin/docker /docker-cli/ && cp -r /usr/local/libexec/docker/cli-plugins /docker-cli/
        volumeMounts:
        - name: docker-cli
          mountPath: /docker-cli
      # Native sidecar: starts (and becomes ready) before code-server, lives as long as the pod.
      # Privileged, so anyone with a code-server terminal is effectively root on the node.
      - name: dind
        image: docker:29.9.2-dind@sha256:9e79b879b177fbd72c34376a3dd3d91747da5db49e1f560f76aea59561471977
        restartPolicy: Always
        securityContext:
          privileged: true
          # Override the pod-level uid 1000: dockerd must run as root
          runAsUser: 0
          runAsGroup: 0
        args:
        - --host=unix:///var/run/dind/docker.sock
        # Socket group = coder's gid, so code-server (uid/gid 1000) can use it
        - --group=1000
        env:
        # Only a unix socket is exposed, no TCP listener that would need TLS
        - name: DOCKER_TLS_CERTDIR
          value: ""
        startupProbe:
          exec:
            command: ["docker", "-H", "unix:///var/run/dind/docker.sock", "info"]
          periodSeconds: 2
          failureThreshold: 60
        volumeMounts:
        - name: docker-socket
          mountPath: /var/run/dind
        # Image/layer/build cache; survives restarts
        - name: docker-data
          mountPath: /var/lib/docker
        # Same path as in code-server: `docker run -v` sources are resolved by
        # dockerd in this container, so bind-mounted project dirs must exist here too
        - name: project
          mountPath: /home/coder/project
      containers:
      - name: code-server
        image: codercom/code-server:4.143.1@sha256:377b66bec5645510ed52549bb00e648c273edc604d230a3f90fd2b2433afcb97
        env:
        - name: DOCKER_USER
          value: coder
        - name: DOCKER_HOST
          value: unix:///var/run/dind/docker.sock
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: local
          mountPath: /home/coder/.local
        - name: config
          mountPath: /home/coder/.config
        - name: project
          mountPath: /home/coder/project
        - name: ssh
          mountPath: /home/coder/.ssh
        - name: docker-socket
          mountPath: /var/run/dind
        - name: docker-cli
          mountPath: /usr/local/bin/docker
          subPath: docker
        # Default CLI plugin dir, so buildx/compose work without extra config
        - name: docker-cli
          mountPath: /usr/local/libexec/docker/cli-plugins
          subPath: cli-plugins
      volumes:
      - name: docker-socket
        emptyDir: {}
      - name: docker-cli
        emptyDir: {}
      - name: docker-data
        hostPath:
          path: /zpool-ssd/k8s/code-server/docker
          type: Directory
      - name: local
        hostPath:
          path: /zpool-ssd/k8s/code-server/local
          type: Directory
      - name: config
        hostPath:
          path: /zpool-ssd/k8s/code-server/config
          type: Directory
      - name: project
        hostPath:
          path: /zpool-ssd/k8s/code-server/project
          type: Directory
      - name: ssh
        hostPath:
          path: /zpool-ssd/k8s/code-server/ssh
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: code-server
  namespace: code-server
spec:
  selector:
    app: code-server
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: code-server
  namespace: code-server
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    acme.cert-manager.io/http01-parentreffallback: "true"
spec:
  parentRef:
    name: main-gateway
    namespace: gateway-system
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    hostname: code.codesugar.mx
    tls:
      mode: Terminate
      certificateRefs:
      - name: code-codesugar-mx-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: code-server
  namespace: code-server
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: ListenerSet
    name: code-server
    sectionName: https
  hostnames:
  - code.codesugar.mx
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: code-server
      port: 80
