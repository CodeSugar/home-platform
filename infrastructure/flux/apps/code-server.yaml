apiVersion: v1
kind: Namespace
metadata:
  name: code-server
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: code-server
  namespace: code-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-read-only
rules:
# Core group: enumerated explicitly so that secrets are excluded
- apiGroups: [""]
  resources:
  - bindings
  - componentstatuses
  - configmaps
  - endpoints
  - events
  - limitranges
  - namespaces
  - namespaces/status
  - nodes
  - nodes/status
  - persistentvolumeclaims
  - persistentvolumeclaims/status
  - persistentvolumes
  - persistentvolumes/status
  - pods
  - pods/log
  - pods/status
  - podtemplates
  - replicationcontrollers
  - replicationcontrollers/scale
  - replicationcontrollers/status
  - resourcequotas
  - resourcequotas/status
  - serviceaccounts
  - services
  - services/status
  verbs: ["get", "list", "watch"]
# Non-core groups: secrets only live in the core group, so wildcards are safe here
- apiGroups:
  - admissionregistration.k8s.io
  - apiextensions.k8s.io
  - apiregistration.k8s.io
  - apps
  - autoscaling
  - batch
  - certificates.k8s.io
  - coordination.k8s.io
  - discovery.k8s.io
  - events.k8s.io
  - flowcontrol.apiserver.k8s.io
  - metrics.k8s.io
  - networking.k8s.io
  - node.k8s.io
  - policy
  - rbac.authorization.k8s.io
  - resource.k8s.io
  - scheduling.k8s.io
  - storage.k8s.io
  # CRDs
  - acme.cert-manager.io
  - cert-manager.io
  - cilium.io
  - fluxcd.controlplane.io
  - gateway.envoyproxy.io
  - gateway.networking.k8s.io
  - gateway.networking.x-k8s.io
  - helm.toolkit.fluxcd.io
  - image.toolkit.fluxcd.io
  - kustomize.toolkit.fluxcd.io
  - notification.toolkit.fluxcd.io
  - source.toolkit.fluxcd.io
  resources: ["*"]
  verbs: ["get", "list", "watch"]
- nonResourceURLs: ["*"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: code-server-cluster-read-only
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-read-only
subjects:
- kind: ServiceAccount
  name: code-server
  namespace: code-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-server
  namespace: code-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: code-server
  template:
    metadata:
      labels:
        app: code-server
    spec:
      serviceAccountName: code-server
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: code-server
        image: codercom/code-server:latest
        env:
        - name: DOCKER_USER
          value: coder
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: local
          mountPath: /home/coder/.local
        - name: config
          mountPath: /home/coder/.config
        - name: project
          mountPath: /home/coder/project
        - name: ssh
          mountPath: /home/coder/.ssh
      volumes:
      - name: local
        hostPath:
          path: /zpool-ssd/k8s/code-server/local
          type: Directory
      - name: config
        hostPath:
          path: /zpool-ssd/k8s/code-server/config
          type: Directory
      - name: project
        hostPath:
          path: /zpool-ssd/k8s/code-server/project
          type: Directory
      - name: ssh
        hostPath:
          path: /zpool-ssd/k8s/code-server/ssh
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: code-server
  namespace: code-server
spec:
  selector:
    app: code-server
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: code-server
  namespace: code-server
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    acme.cert-manager.io/http01-parentreffallback: "true"
spec:
  parentRef:
    name: main-gateway
    namespace: gateway-system
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    hostname: code.codesugar.mx
    tls:
      mode: Terminate
      certificateRefs:
      - name: code-codesugar-mx-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: code-server
  namespace: code-server
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: ListenerSet
    name: code-server
    sectionName: https
  hostnames:
  - code.codesugar.mx
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: code-server
      port: 80
