apiVersion: v1
kind: Namespace
metadata:
  name: forgejo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      volumes:
      - name: forgejo-data
        hostPath:
          path: /zpool-ssd/k8s/forgejo/data
          type: Directory
      - name: localtime
        hostPath:
          path: /etc/localtime
          type: File
      containers:
      - name: forgejo
        image: codeberg.org/forgejo/forgejo:16.0.5
        env:
        - name: USER_UID
          value: "1000"
        - name: USER_GID
          value: "1000"
        - name: FORGEJO__server__SSH_DOMAIN
          value: git.codesugar.mx
        - name: FORGEJO__server__SSH_PORT
          value: "22"
        ports:
        - containerPort: 3000
          name: http
        - containerPort: 22
          name: ssh
        volumeMounts:
        - name: forgejo-data
          mountPath: /data
        - name: localtime
          mountPath: /etc/localtime
          readOnly: true
        livenessProbe:
          httpGet:
            path: /api/healthz
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 20
        startupProbe:
          httpGet:
            path: /api/healthz
            port: 3000
          failureThreshold: 20
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: forgejo
  namespace: forgejo
spec:
  selector:
    app: forgejo
  ports:
  - name: http
    port: 80
    targetPort: 3000
  - name: ssh
    port: 22
    targetPort: 22
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: forgejo
  namespace: forgejo
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    acme.cert-manager.io/http01-parentreffallback: "true"
spec:
  parentRef:
    name: main-gateway
    namespace: gateway-system
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    hostname: git.codesugar.mx
    tls:
      mode: Terminate
      certificateRefs:
      - name: forejo-codesugar-mx-tls
  # Plain L4 passthrough, handled by Cilium's eBPF LB (not Envoy)
  - name: ssh
    protocol: TCP
    port: 22
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo
  namespace: forgejo
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: ListenerSet
    name: forgejo
    sectionName: https
  hostnames:
  - git.codesugar.mx
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: forgejo
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: forgejo-ssh
  namespace: forgejo
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: ListenerSet
    name: forgejo
    sectionName: ssh
  rules:
  - backendRefs:
    - name: forgejo
      port: 22
---
# The SSH TCPRoute is handled by Cilium's eBPF LB, not Envoy, so it bypasses the
# gateway's reserved:ingress policy (lan-only-policy.yaml) and the internet was
# reaching sshd directly (source IP is preserved). Filter at the pod instead.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: forgejo-lan-only
  namespace: forgejo
spec:
  endpointSelector:
    matchLabels:
      app: forgejo
  ingress:
  # HTTP arrives via the gateway's Envoy; host visibility is enforced there
  - fromEntities:
    - ingress
    toPorts:
    - ports:
      - port: "3000"
        protocol: TCP
  # Kubelet probes, and anything else in-cluster (e.g. git from code-server)
  - fromEntities:
    - host
    - cluster
    toPorts:
    - ports:
      - port: "3000"
        protocol: TCP
      - port: "22"
        protocol: TCP
  # SSH: same trusted sources as the gateway policy
  - fromCIDR:
    - 192.168.0.0/16
    - 201.119.42.162/32
    toPorts:
    - ports:
      - port: "22"
        protocol: TCP
