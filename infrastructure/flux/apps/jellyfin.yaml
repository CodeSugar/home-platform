apiVersion: v1
kind: Namespace
metadata:
  name: jellyfin
---
apiVersion: v1
kind: Pod
metadata:
  name: jellyfin
  labels:
    app: jellyfin
  namespace: jellyfin
spec:
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containers:
  - name: jellyfin
    image: jellyfin/jellyfin:10.11.11
    ports:
    - containerPort: 8096
      name: http
    volumeMounts:
    - name: jellyfin-config
      mountPath: /config
    - name: jellyfin-cache
      mountPath: /cache
    - name: jellyfin-media
      mountPath: /media
    - name: jellyfin-hardware
      mountPath: /dev/dri
    securityContext:
      privileged: true
    env:
    - name: JELLYFIN_PublishedServerUrl
      value: "https://jellyfin.codesugar.mx"
  volumes:
  - name: jellyfin-config
    hostPath:
      path: /mnt/main/k8s/jellyfin/config
      type: DirectoryOrCreate
  - name: jellyfin-cache
    hostPath:
      path: /mnt/main/k8s/jellyfin/cache
      type: DirectoryOrCreate
  - name: jellyfin-media
    hostPath:
      path: /mnt/main/k8s/media/
      type: DirectoryOrCreate
  - name: jellyfin-hardware
    hostPath:
      path: /dev/dri
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  selector:
    app: jellyfin
  ports:
  - name: http
    port: 80
    targetPort: 8096
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  parentRefs:
  - name: main-gateway
    namespace: gateway-system
  hostnames:
  - jellyfin.codesugar.mx
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: jellyfin
      port: 80