apiVersion: v1
kind: Namespace
metadata:
  name: jellyfin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  replicas: 1
  # hostPath storage: never run two pods against the same config dir
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: jellyfin
        image: jellyfin/jellyfin:10.11.11
        ports:
        - containerPort: 8096
          name: http
        volumeMounts:
        - name: jellyfin-config
          mountPath: /config
        - name: jellyfin-cache
          mountPath: /cache
        - name: jellyfin-media
          mountPath: /media
        # Retro games library for the Moonfin plugin: one folder per system
        # (NES, SNES, GBA, PSX, ...), see
        # https://github.com/Moonfin-Client/Plugin/wiki/Retro-Games
        - name: jellyfin-roms
          mountPath: /roms
        - name: jellyfin-hardware
          mountPath: /dev/dri
        securityContext:
          privileged: true
        env:
        - name: JELLYFIN_PublishedServerUrl
          value: "https://jellyfin.codesugar.mx"
      volumes:
      - name: jellyfin-config
        hostPath:
          path: /mnt/main/k8s/jellyfin/config
          type: DirectoryOrCreate
      - name: jellyfin-cache
        hostPath:
          path: /mnt/main/k8s/jellyfin/cache
          type: DirectoryOrCreate
      - name: jellyfin-media
        hostPath:
          path: /mnt/main/k8s/media/
          type: DirectoryOrCreate
      - name: jellyfin-roms
        hostPath:
          path: /mnt/main/k8s/roms/
          type: DirectoryOrCreate
      - name: jellyfin-hardware
        hostPath:
          path: /dev/dri
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  selector:
    app: jellyfin
  ports:
  - name: http
    port: 80
    targetPort: 8096
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: jellyfin
  namespace: jellyfin
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    acme.cert-manager.io/http01-parentreffallback: "true"
spec:
  parentRef:
    name: main-gateway
    namespace: gateway-system
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    hostname: jellyfin.codesugar.mx
    tls:
      mode: Terminate
      certificateRefs:
      - name: jellyfin-codesugar-mx-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: ListenerSet
    name: jellyfin
    sectionName: https
  hostnames:
  - jellyfin.codesugar.mx
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: jellyfin
      port: 80