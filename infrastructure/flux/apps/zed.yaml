apiVersion: v1
kind: Namespace
metadata:
  name: zed
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zed
  namespace: zed
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zed
  template:
    metadata:
      labels:
        app: zed
    spec:
      containers:
      - name: zed
        image: ghcr.io/zee295/zed-web:latest
        ports:
        - containerPort: 8090
          name: http
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        readinessProbe:
          tcpSocket:
            port: http
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 30
      volumes:
      - name: workspace
        hostPath:
          path: /zpool-ssd/k8s/zed/workspace
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: zed
  namespace: zed
spec:
  selector:
    app: zed
  ports:
  - name: http
    port: 80
    targetPort: 8090
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: zed
  namespace: zed
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    acme.cert-manager.io/http01-parentreffallback: "true"
spec:
  parentRef:
    name: main-gateway
    namespace: gateway-system
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    hostname: zed.codesugar.mx
    tls:
      mode: Terminate
      certificateRefs:
      - name: zed-codesugar-mx-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zed
  namespace: zed
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: ListenerSet
    name: zed
    sectionName: https
  hostnames:
  - zed.codesugar.mx
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: zed
      port: 80
