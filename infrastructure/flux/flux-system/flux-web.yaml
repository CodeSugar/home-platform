# helm upgrade flux-operator oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator  --namespace flux-system --reuse-values --set web.enabled=false
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: flux-web
  namespace: flux-system
spec:
  interval: 30m0s
  url: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    semver: "0.x"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-web
  namespace: flux-system
spec:
  interval: 30m0s
  releaseName: flux-web
  serviceAccountName: flux-operator
  chartRef:
    kind: OCIRepository
    name: flux-web
  values:
    fullnameOverride: flux-web
    installCRDs: false
    web:
      serverOnly: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: flux-web
  namespace: flux-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    acme.cert-manager.io/http01-parentreffallback: "true"
spec:
  parentRef:
    name: main-gateway
    namespace: gateway-system
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    hostname: flux.codesugar.mx
    tls:
      mode: Terminate
      certificateRefs:
      - name: flux-codesugar-mx-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-web
  namespace: flux-system
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: ListenerSet
    name: flux-web
    sectionName: https
  hostnames:
  - flux.codesugar.mx
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: flux-web
      port: 9080
