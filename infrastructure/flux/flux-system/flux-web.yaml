# helm upgrade flux-operator oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator  --namespace flux-system --reuse-values --set web.enabled=false
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: flux-web
  namespace: flux-system
spec:
  interval: 30m0s
  url: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    semver: "0.x"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-web
  namespace: flux-system
spec:
  interval: 30m0s
  releaseName: flux-web
  serviceAccountName: flux-operator
  chartRef:
    kind: OCIRepository
    name: flux-web
  values:
    fullnameOverride: flux-web
    installCRDs: false
    web:
      serverOnly: true
      # SSO through Authelia (client "flux-web" in auth/authelia.yaml). The UI
      # impersonates the logged-in user with the ID token's email and groups
      # claims, so what they can see/do is plain RBAC (see the binding below).
      config:
        baseURL: https://flux.codesugar.mx
        authentication:
          type: OAuth2
          oauth2:
            provider: OIDC
            issuerURL: https://auth.codesugar.mx
            clientID: flux-web
  # Created out-of-band (not committed), with the plaintext half of the
  # FLUX_WEB_OIDC_CLIENT_SECRET_DIGEST pair in authelia-secrets:
  #   kubectl -n flux-system create secret generic flux-web-client --from-literal=client-secret=...
  valuesFrom:
  - kind: Secret
    name: flux-web-client
    valuesKey: client-secret
    targetPath: web.config.authentication.oauth2.clientSecret
---
# LLDAP group -> full Flux web UI access (read everything, reconcile/suspend/
# resume/download Flux objects, restart workloads, delete pods). flux-web-admin
# is created by the chart (web.rbac.createRoles).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-web-ldap-k8s-admin
subjects:
- kind: Group
  name: ldap-k8s-admin
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: flux-web-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: flux-web
  namespace: flux-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    acme.cert-manager.io/http01-parentreffallback: "true"
spec:
  parentRef:
    name: main-gateway
    namespace: gateway-system
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    hostname: flux.codesugar.mx
    tls:
      mode: Terminate
      certificateRefs:
      - name: flux-codesugar-mx-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-web
  namespace: flux-system
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: ListenerSet
    name: flux-web
    sectionName: https
  hostnames:
  - flux.codesugar.mx
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: flux-web
      port: 9080
---
# FluxInstance sets networkPolicy: true, which blocks Cilium Gateway traffic
# (reserved "ingress" identity) to pods in flux-system. Allow it to reach the
# flux-web UI and the cert-manager HTTP-01 solver pods.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-gateway-flux-web
  namespace: flux-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: flux-web
  ingress:
  - fromEntities:
    - ingress
    toPorts:
    - ports:
      - port: "9080"
        protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-gateway-acme-solver
  namespace: flux-system
spec:
  endpointSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  ingress:
  - fromEntities:
    - ingress
    toPorts:
    - ports:
      - port: "8089"
        protocol: TCP
