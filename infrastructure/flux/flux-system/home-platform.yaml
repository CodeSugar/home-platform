apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: home-platform
  namespace: flux-system
spec:
  # Push-triggered via the webhook Receiver (receiver.yaml); polling is only a
  # fallback for missed deliveries (GitHub does not retry them).
  interval: 1h0m0s
  url: https://github.com/CodeSugar/home-platform.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-platform
  namespace: flux-system
spec:
  # Drift correction only: a new source revision triggers a reconcile immediately.
  interval: 10m0s
  path: ./infrastructure/flux
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-platform