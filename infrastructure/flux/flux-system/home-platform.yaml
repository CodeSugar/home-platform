apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: home-platform
  namespace: flux-system
spec:
  interval: 5m0s
  url: https://github.com/CodeSugar/home-platform.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-platform
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./infrastructure/flux
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-platform