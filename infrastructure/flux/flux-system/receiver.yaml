# Requires the token secret (not stored in git):
#   kubectl -n flux-system create secret generic webhook-token \
#     --from-literal=token=$(head -c 32 /dev/urandom | shasum | cut -d ' ' -f1)
# GitHub webhook payload URL: https://webhook-flux.codesugar.mx + Receiver .status.webhookPath
# (content type application/json, secret = the token above)
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: home-platform
  namespace: flux-system
spec:
  type: github
  events:
  - ping
  - push
  secretRef:
    name: webhook-token
  resources:
  - apiVersion: source.toolkit.fluxcd.io/v1
    kind: GitRepository
    name: home-platform
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: webhook-receiver
  namespace: flux-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    acme.cert-manager.io/http01-parentreffallback: "true"
spec:
  parentRef:
    name: main-gateway
    namespace: gateway-system
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    hostname: webhook-flux.codesugar.mx
    tls:
      mode: Terminate
      certificateRefs:
      - name: webhook-flux-codesugar-mx-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webhook-receiver
  namespace: flux-system
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: ListenerSet
    name: webhook-receiver
    sectionName: https
  hostnames:
  - webhook-flux.codesugar.mx
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /hook/
    backendRefs:
    - name: webhook-receiver
      port: 80
---
# FluxInstance sets networkPolicy: true, whose allow-webhooks policy only matches
# pod/namespace sources. Cilium Gateway traffic comes from the reserved "ingress"
# identity, which those rules don't match, so allow it explicitly.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-gateway-webhooks
  namespace: flux-system
spec:
  endpointSelector:
    matchLabels:
      app: notification-controller
  ingress:
  - fromEntities:
    - ingress
    toPorts:
    - ports:
      - port: "9292"
        protocol: TCP
