apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: auth
data:
  configuration.yml: |
    server:
      address: tcp://:9091
    log:
      level: info
    theme: auto
    totp:
      issuer: codesugar.mx
    authentication_backend:
      ldap:
        implementation: lldap
        address: ldap://lldap.auth.svc.cluster.local:3890
        base_dn: dc=codesugar,dc=mx
        # Bind user created in lldap, member of lldap_password_manager (or lldap_strict_readonly
        # if password reset from Authelia is not needed). Password comes from the secret below.
        user: uid=authelia,ou=people,dc=codesugar,dc=mx
    access_control:
      default_policy: one_factor
    session:
      cookies:
      - domain: codesugar.mx
        authelia_url: https://auth.codesugar.mx
    storage:
      local:
        path: /config/db.sqlite3
    notifier:
      filesystem:
        filename: /config/notification.txt
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
  namespace: auth
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: authelia
  template:
    metadata:
      labels:
        app: authelia
    spec:
      containers:
      - name: authelia
        image: authelia/authelia:latest
        args:
        - --config=/etc/authelia/configuration.yml
        ports:
        - name: http
          containerPort: 9091
        env:
        - name: TZ
          value: America/Mexico_City
        - name: AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE
          value: /secrets/JWT_SECRET
        - name: AUTHELIA_SESSION_SECRET_FILE
          value: /secrets/SESSION_SECRET
        - name: AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE
          value: /secrets/STORAGE_ENCRYPTION_KEY
        - name: AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD_FILE
          value: /secrets/LDAP_PASSWORD
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
        volumeMounts:
        - name: config
          mountPath: /etc/authelia
          readOnly: true
        - name: secrets
          mountPath: /secrets
          readOnly: true
        - name: data
          mountPath: /config
      volumes:
      - name: config
        configMap:
          name: authelia-config
      # Created out-of-band (not committed): kubectl -n auth create secret generic authelia-secrets \
      #   --from-literal=JWT_SECRET=... --from-literal=SESSION_SECRET=... \
      #   --from-literal=STORAGE_ENCRYPTION_KEY=... --from-literal=LDAP_PASSWORD=...
      - name: secrets
        secret:
          secretName: authelia-secrets
      - name: data
        hostPath:
          path: /zpool-ssd/k8s/authelia/config
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: authelia
  namespace: auth
spec:
  selector:
    app: authelia
  ports:
  - name: http
    port: 9091
    targetPort: 9091
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: authelia
  namespace: auth
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    acme.cert-manager.io/http01-parentreffallback: "true"
spec:
  parentRef:
    name: main-gateway
    namespace: gateway-system
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    hostname: auth.codesugar.mx
    tls:
      mode: Terminate
      certificateRefs:
      - name: auth-codesugar-mx-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authelia
  namespace: auth
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: ListenerSet
    name: authelia
    sectionName: https
  hostnames:
  - auth.codesugar.mx
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: authelia
      port: 9091
