apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: auth
data:
  configuration.yml: |
    server:
      address: tcp://:9091
    log:
      level: info
    theme: auto
    totp:
      disable: false
      issuer: codesugar.mx
      # Defaults below are the most compatible with authenticator apps (Google Authenticator, Aegis, etc.)
      algorithm: SHA1
      digits: 6
      period: 30
      skew: 1
      secret_size: 32
      allowed_algorithms:
      - SHA1
      allowed_digits:
      - 6
      allowed_periods:
      - 30
      disable_reuse_security_policy: false
    authentication_backend:
      ldap:
        implementation: lldap
        address: ldap://lldap.auth.svc.cluster.local:3890
        base_dn: dc=codesugar,dc=mx
        # Bind user created in lldap, member of lldap_password_manager (or lldap_strict_readonly
        # if password reset from Authelia is not needed). Password comes from the secret below.
        user: uid=authelia,ou=people,dc=codesugar,dc=mx
    access_control:
      default_policy: two_factor
    session:
      cookies:
      - domain: codesugar.mx
        authelia_url: https://auth.codesugar.mx
    storage:
      local:
        path: /config/db.sqlite3
    notifier:
      filesystem:
        filename: /config/notification.txt
    # OIDC provider. The "secret" template calls are expanded by the template filter
    # (X_AUTHELIA_CONFIG_FILTERS) from files in authelia-secrets, so no key
    # material is committed. hmac_secret comes from an env _FILE variable.
    # The filter also runs over comments: never write template braces in one.
    identity_providers:
      oidc:
        jwks:
        - key: {{ secret "/secrets/OIDC_JWKS_KEY" | mindent 8 "|" | msquote }}
        claims_policies:
          # By default Authelia keeps everything but sub/iss/... out of the ID token
          # (it's only served by userinfo). Flux web impersonates from the ID token's
          # email and groups claims, so they have to be in it.
          id-token-claims:
            id_token: [email, email_verified, groups, name, preferred_username]
        clients:
        - client_id: flux-web
          client_name: Flux Web UI
          client_secret: '{{ secret "/secrets/FLUX_WEB_OIDC_CLIENT_SECRET_DIGEST" }}'
          claims_policy: id-token-claims
          authorization_policy: two_factor
          redirect_uris:
          - https://flux.codesugar.mx/oauth2/callback
          # Flux web's default scopes; offline_access needs the refresh_token grant
          scopes: [openid, offline_access, profile, email, groups]
          grant_types: [authorization_code, refresh_token]
          response_types: [code]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
  namespace: auth
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: authelia
  template:
    metadata:
      labels:
        app: authelia
    spec:
      # Service "authelia" would inject AUTHELIA_PORT=tcp://... etc., which Authelia parses as config
      enableServiceLinks: false
      containers:
      - name: authelia
        image: authelia/authelia:latest
        command:
        - authelia
        - --config=/etc/authelia/configuration.yml
        ports:
        - name: http
          containerPort: 9091
        env:
        - name: TZ
          value: America/Mexico_City
        - name: AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE
          value: /secrets/JWT_SECRET
        - name: AUTHELIA_SESSION_SECRET_FILE
          value: /secrets/SESSION_SECRET
        - name: AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE
          value: /secrets/STORAGE_ENCRYPTION_KEY
        - name: AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD_FILE
          value: /secrets/LDAP_PASSWORD
        - name: AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE
          value: /secrets/OIDC_HMAC_SECRET
        - name: X_AUTHELIA_CONFIG_FILTERS
          value: template
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
        volumeMounts:
        - name: config
          mountPath: /etc/authelia
          readOnly: true
        - name: secrets
          mountPath: /secrets
          readOnly: true
        - name: data
          mountPath: /config
      volumes:
      - name: config
        configMap:
          name: authelia-config
      # Created out-of-band (not committed): kubectl -n auth create secret generic authelia-secrets \
      #   --from-literal=JWT_SECRET=... --from-literal=SESSION_SECRET=... \
      #   --from-literal=STORAGE_ENCRYPTION_KEY=... --from-literal=LDAP_PASSWORD=... \
      #   --from-literal=OIDC_HMAC_SECRET=... --from-file=OIDC_JWKS_KEY=private.pem \
      #   --from-literal=FLUX_WEB_OIDC_CLIENT_SECRET_DIGEST='$pbkdf2-sha512$...'
      # OIDC values: see "OIDC clients" in docs/guides/k8s-auth.md.
      - name: secrets
        secret:
          secretName: authelia-secrets
      - name: data
        hostPath:
          path: /zpool-ssd/k8s/authelia/config
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: authelia
  namespace: auth
spec:
  selector:
    app: authelia
  ports:
  - name: http
    port: 9091
    targetPort: 9091
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: authelia
  namespace: auth
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    acme.cert-manager.io/http01-parentreffallback: "true"
spec:
  parentRef:
    name: main-gateway
    namespace: gateway-system
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    hostname: auth.codesugar.mx
    tls:
      mode: Terminate
      certificateRefs:
      - name: auth-codesugar-mx-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authelia
  namespace: auth
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: ListenerSet
    name: authelia
    sectionName: https
  hostnames:
  - auth.codesugar.mx
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: authelia
      port: 9091
